services:
  mysql:
    image: mysql:8.0
    container_name: shopping-cart-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Winter15!
      MYSQL_DATABASE: shopping_cart_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pWinter15!"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: shopping-cart-api
    container_name: shopping-cart-api
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shopping_cart_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Winter15!

volumes:
  mysql-data: